<!doctype html><html lang="en"><head><base target="_top"><meta name="viewport" content="width=device-width, initial-scale=1"><style>
*{box-sizing:border-box}body{font:14px system-ui,sans-serif;color:#14213d;background:#f4f6f9;margin:0;padding:14px}h2{margin:0 0 6px}.muted{color:#66758b}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.stat{background:#fff;padding:12px;border-radius:10px;border:1px solid #dce2eb}.stat b{display:block;font-size:22px}.stat small{color:#66758b}input,select,button{padding:10px;border-radius:8px;border:1px solid #cbd3df;font:inherit}input{width:100%;margin:6px 0}select{flex:1;min-width:0}button{background:#14213d;color:#fff;cursor:pointer}.filters{display:flex;gap:8px}.entry{background:white;border:1px solid #dce2eb;border-radius:10px;padding:12px;margin:8px 0}.head{display:flex;justify-content:space-between;gap:8px}.pass{color:#137a4a}.fail{color:#b3261e}.detail{margin-top:9px;padding-top:9px;border-top:1px solid #eee;overflow-wrap:anywhere}summary{cursor:pointer}.date{font-size:12px;color:#66758b}#status{margin-top:10px}
</style></head><body><h2>Exam history</h2><div class="muted">Private Google Sheets dashboard</div><div id="status">Loading…</div><div class="stats" id="stats"></div><input id="search" placeholder="Search student name"><div class="filters"><select id="result"><option value="all">All results</option><option value="pass">Passed</option><option value="fail">Failed</option></select><button id="refresh">Refresh</button></div><div id="entries"></div><script>
let rows=[];const $=id=>document.getElementById(id);const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(){ $('status').textContent='Loading…';google.script.run.withSuccessHandler(data=>{rows=data;render();$('status').textContent='Updated '+new Date().toLocaleTimeString()}).withFailureHandler(e=>$('status').textContent='Could not load: '+e.message).getExamHistory()}
function render(){const q=$('search').value.trim().toLocaleLowerCase(),f=$('result').value;const filtered=rows.filter(r=>r.name.toLocaleLowerCase().includes(q)&&(f==='all'||(f==='pass')===r.passed));const students=new Set(rows.map(r=>r.name.trim().toLocaleLowerCase())).size,passed=rows.filter(r=>r.passed).length,avg=rows.length?(rows.reduce((s,r)=>s+r.percent,0)/rows.length).toFixed(1):'0';$('stats').innerHTML=[[rows.length,'Attempts'],[students,'Unique names'],[rows.length?Math.round(passed/rows.length*100)+'%':'0%','Pass rate'],[avg+'%','Average score']].map(x=>'<div class="stat"><b>'+x[0]+'</b><small>'+x[1]+'</small></div>').join('');$('entries').innerHTML=filtered.length?filtered.map(r=>'<div class="entry"><div class="head"><strong>'+safe(r.name)+'</strong><strong class="'+(r.passed?'pass':'fail')+'">'+r.score+'/'+r.total+' · '+(r.passed?'PASS':'FAIL')+'</strong></div><div class="date">'+safe(new Date(r.date).toLocaleString())+' · '+Math.floor(r.seconds/60)+'m '+r.seconds%60+'s</div><details class="detail"><summary>Attempt details</summary><div>Attempt ID: '+safe(r.id)+'</div><div>Incorrect/unanswered question IDs: '+safe(r.wrong||'None')+'</div></details></div>').join(''):'<p class="muted">No matching attempts.</p>'}
$('search').addEventListener('input',render);$('result').addEventListener('change',render);$('refresh').addEventListener('click',load);load();
</script></body></html>
