<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>امتحان السواقة النظري – تدرّب</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14213d;--mut:#55627a;--bg:#eceff1;--card:#fff;--line:#cfd6dd;--sign:#f5c400;--ok:#1e7b4f;--okbg:#e3f3ea;--bad:#b3261e;--badbg:#fbe7e5;--r:10px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.7 "IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
main{max-width:760px;margin:0 auto;padding:16px 16px 56px}
h1{font-size:2rem;line-height:1.3;margin:.2em 0 .4em;font-weight:700}
h2{font-size:1.25rem;margin:1.6em 0 .6em}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.btn{display:inline-block;border:0;border-radius:var(--r);background:var(--ink);color:#fff;padding:12px 26px;font-weight:700;cursor:pointer;min-height:48px}
.btn.alt{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
/* road strip: marks the top of every screen */
.road{height:14px;margin:0 -16px 20px;background:#2d3540;position:relative}
.road::after{content:"";position:absolute;inset:6px 0 auto;height:2px;background:repeating-linear-gradient(to left,#fff 0 22px,transparent 22px 40px)}
.road i{position:absolute;top:0;bottom:0;right:0;background:var(--sign);width:0;transition:width .3s}
/* start */
.facts{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 22px;padding:0;list-style:none}
.facts li{background:var(--bg);border-radius:var(--r);padding:6px 14px;font-weight:500}
label{display:block;font-weight:500;margin-bottom:6px}
input[type=text]{width:100%;border:2px solid var(--line);border-radius:var(--r);padding:11px 14px;background:#fff;margin-bottom:16px}
.warn{color:var(--bad);min-height:1.6em;margin:-8px 0 8px}
/* exam */
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;font-weight:500}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.4rem;background:var(--sign);color:var(--ink);padding:2px 14px;border-radius:var(--r);direction:ltr}
.timer.low{background:var(--bad);color:#fff}
.qimg{display:block;margin:0 auto 14px;max-width:170px;width:46%;height:auto;background:#fff}
.q{font-size:1.2rem;font-weight:700;margin:0 0 16px}
.opts{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.opt{width:100%;text-align:right;background:#fff;border:2px solid var(--line);border-radius:var(--r);padding:12px 16px;cursor:pointer;min-height:56px}
.opt:hover{border-color:var(--ink)}
.opt[aria-pressed=true]{border-color:var(--ink);background:#fff6cc;box-shadow:inset -6px 0 0 var(--sign)}
.nav{display:flex;justify-content:space-between;gap:10px;margin:16px 0}
.grid{display:flex;flex-wrap:wrap;gap:6px}
.grid button{width:40px;height:40px;border:2px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;font-weight:500}
.grid button.done{background:var(--ink);border-color:var(--ink);color:#fff}
.grid button.cur{outline:3px solid var(--sign);outline-offset:1px}
/* result */
.score{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.score b{font-size:3.6rem;line-height:1;direction:ltr}
.verdict{display:inline-block;padding:2px 14px;border-radius:var(--r);font-weight:700}
.verdict.ok{background:var(--okbg);color:var(--ok)}.verdict.no{background:var(--badbg);color:var(--bad)}
.save{color:var(--mut);font-size:.95rem;margin:10px 0 0}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
th,td{padding:10px 12px;text-align:right;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--ink);color:#fff;font-weight:500;font-size:.95rem}
td.me{background:var(--badbg);color:var(--bad)}td.rt{background:var(--okbg);color:var(--ok);font-weight:500}
td img{display:block;width:72px;height:auto;margin-bottom:6px}
@media(max-width:620px){
 body{font-size:17px}h1{font-size:1.6rem}
 thead{position:absolute;left:-9999px}
 table,tbody,tr,td{display:block;width:100%}
 tr{border-bottom:8px solid var(--bg)}
 td{border:0}td[data-l]::before{content:attr(data-l);display:block;font-size:.8rem;font-weight:700;opacity:.7}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<noscript>يرجى تفعيل JavaScript لاستخدام الامتحان.</noscript>
<script src="config.js"></script>
<script src="questions.js"></script>
<script>
const C = window.CONFIG, ALL = window.QUESTIONS, app = document.getElementById('app');
const CATS = ['signs', 'law', 'safety'];
const TOTAL = C.PER_CATEGORY * CATS.length;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const ALLABOVE = /ك[لّ\u0651]*\s*ما\s*(ورد|سبق)/;
let S = null, tick = null;

/* Picks questions the student has not seen yet; once a category is used up, its history resets. */
function pick(cat, n) {
  const pool = ALL.filter(q => q.cat === cat), seen = store.get('seen_' + cat, []);
  let fresh = pool.filter(q => !seen.includes(q.id)), got = shuffle(fresh).slice(0, n), hist = seen.concat(got.map(q => q.id));
  if (got.length < n) {
    const rest = shuffle(pool.filter(q => !got.includes(q)));
    const more = rest.slice(0, n - got.length); got = got.concat(more); hist = more.map(q => q.id);
  }
  store.set('seen_' + cat, hist);
  return got;
}
function buildExam() {
  return shuffle(CATS.flatMap(c => pick(c, C.PER_CATEGORY))).map(q => {
    const items = q.o.map((t, i) => ({ t, ok: i === q.a }));
    const tail = items.filter(x => ALLABOVE.test(x.t));
    return { id: q.id, q: q.q, img: q.img, opts: shuffle(items.filter(x => !tail.includes(x))).concat(tail), pick: null };
  });
}


function home() {
  // Stop any previous exam timer
  clearInterval(tick);
  S = null;
  window.onbeforeunload = null;

  // Display welcome screen
  app.innerHTML = `
    <div class="road"></div>

    <h1>امتحان السواقة النظري</h1>

    <p>
      تدرّب على أسئلة الإشارات والقانون والسلامة.
      تتغيّر الأسئلة في كل محاولة.
    </p>

    <ul class="facts">
      <li>${TOTAL} سؤالاً</li>
      <li>${C.EXAM_MINUTES} دقيقة</li>
      <li>علامة النجاح ${C.PASS_SCORE} من ${TOTAL}</li>
    </ul>

    <div class="card">
      <label for="nm">اسمك الكامل</label>

      <input
        id="nm"
        type="text"
        name="driving_exam_student"
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
        maxlength="60"
        placeholder="اكتب اسمك الكامل"
        value=""
      >

      <div class="warn" id="w"></div>

      <button
        type="button"
        class="btn"
        id="go"
      >
        ابدأ الامتحان
      </button>
    </div>
  `;

  const nameInput = document.getElementById('nm');
  const startButton = document.getElementById('go');
  const warning = document.getElementById('w');

  // Make sure the name field is editable
  nameInput.disabled = false;
  nameInput.readOnly = false;

  // Remove any browser-restored value
  nameInput.value = '';

  // Clear warning when student types
  nameInput.addEventListener('input', () => {
    warning.textContent = '';
  });

  // Start exam
  const go = () => {
    const name = nameInput.value.trim();

    if (name.length < 2) {
      warning.textContent = 'يرجى إدخال اسمك الكامل قبل بدء الامتحان.';
      nameInput.focus();
      return;
    }

    // Save student name
    store.set('name', name);

    // Start exam using entered name
    start(name);
  };

  // Start by clicking the button
  startButton.addEventListener('click', go);

  // Start by pressing Enter
  nameInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      go();
    }
  });
}

function start(name) {
  S = { name, qs: buildExam(), i: 0, t0: Date.now(), end: Date.now() + C.EXAM_MINUTES * 60000 };
  window.onbeforeunload = e => { e.preventDefault(); return ''; };
  clearInterval(tick);
  tick = setInterval(clock, 250);
  draw();
}
function clock() {
  if (!S) return;
  const left = Math.max(0, S.end - Date.now()), el = document.getElementById('tm');
  if (el) { const s = Math.ceil(left / 1000); el.textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); el.classList.toggle('low', s <= 60); }
  if (left <= 0) finish(true);
}

function draw() {
  if (!S) return;

  const q = S.qs[S.i];

  app.innerHTML = `
    <div class="road">
      <i style="width:${S.i / TOTAL * 100}%"></i>
    </div>

    <div class="bar">
      <span>السؤال ${S.i + 1} من ${TOTAL}</span>
      <span class="timer" id="tm" role="timer"></span>
    </div>

    <div class="card">
      ${q.img ? `<img class="qimg" src="${q.img}" alt="إشارة مرور">` : ''}

      <p class="q">${esc(q.q)}</p>

      <ul class="opts">
        ${q.opts.map((o, k) => `
          <li>
            <button
              type="button"
              class="opt"
              data-k="${k}"
              aria-pressed="${q.pick === k}"
            >${esc(o.t)}</button>
          </li>
        `).join('')}
      </ul>
    </div>

    <div class="nav">
      ${S.i < TOTAL - 1
        ? '<button type="button" class="btn" id="nx" disabled>التالي</button>'
        : '<button type="button" class="btn" id="fin" disabled>إنهاء الامتحان</button>'
      }
    </div>

    <p class="save">
      بعد الضغط على التالي لا يمكنك العودة إلى السؤال السابق.
    </p>
  `;

  clock();

  app.querySelectorAll('.opt').forEach(b => {
    b.onclick = () => {
      if (!S || S.qs[S.i] !== q) return;

      q.pick = Number(b.dataset.k);

      app.querySelectorAll('.opt').forEach(option => {
        option.setAttribute(
          'aria-pressed',
          String(option === b)
        );
      });

      const action =
        document.getElementById('nx') ||
        document.getElementById('fin');

      if (action) action.disabled = false;
    };
  });

  const next = document.getElementById('nx');

  if (next) {
    next.onclick = () => {
      if (!S || S.qs[S.i] !== q || q.pick === null) return;

      S.i += 1;
      draw();
      window.scrollTo(0, 0);
    };
  }

  const fin = document.getElementById('fin');

  if (fin) {
    fin.onclick = () => {
      if (!S || S.qs[S.i] !== q || q.pick === null) return;

      finish(false);
    };
  }
}

function finish(timeUp) {
  if (!S) return;
  clearInterval(tick); window.onbeforeunload = null;
  const secs = Math.min(C.EXAM_MINUTES * 60, Math.round((Date.now() - S.t0) / 1000));
  const wrong = S.qs.filter(q => q.pick === null || !q.opts[q.pick].ok);
  const score = TOTAL - wrong.length, pct = Math.round(score / TOTAL * 100), passed = score >= C.PASS_SCORE;
  const rows = wrong.map(q => `<tr>
    <td data-l="السؤال">${q.img ? `<img src="${q.img}" alt="إشارة مرور">` : ''}${esc(q.q)}</td>
    <td class="me" data-l="إجابتك">${q.pick === null ? 'لم تجب' : esc(q.opts[q.pick].t)}</td>
    <td class="rt" data-l="الإجابة الصحيحة">${esc(q.opts.find(o => o.ok).t)}</td></tr>`).join('');
  app.innerHTML = `<div class="road"><i style="width:100%"></i></div>
  <h1>${esc(S.name)}</h1>${timeUp ? '<p>انتهى الوقت.</p>' : ''}
  <div class="card">
    <div class="score"><b>${score}/${TOTAL}</b><span>${pct}%</span><span class="verdict ${passed ? 'ok' : 'no'}">${passed ? 'ناجح' : 'لم تصل إلى علامة النجاح'}</span></div>
    <p class="save" id="sv">جارٍ حفظ النتيجة…</p>
  </div>
  <h2>${wrong.length ? `الأسئلة التي أخطأت فيها (${wrong.length})` : 'أجبت عن كل الأسئلة بشكل صحيح'}</h2>
  ${wrong.length ? `<table><thead><tr><th>السؤال</th><th>إجابتك</th><th>الإجابة الصحيحة</th></tr></thead><tbody>${rows}</tbody></table>` : ''}
  <p style="margin-top:24px"><button class="btn" id="re">أعد الامتحان بأسئلة جديدة</button></p>`;
  document.getElementById('re').onclick = () => start(S.name);
  window.scrollTo(0, 0);
  save({ attemptId: (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now())+'-'+Math.random().toString(36).slice(2), name: S.name, score, total: TOTAL, percent: pct, passed, seconds: secs, wrong: wrong.map(q => q.id) });
}

/* Scores go to a Google Sheet through Apps Script. Failed sends are kept and retried on the next visit. */
async function send(p) {
  await fetch(C.SCORE_ENDPOINT, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(p) });
}
async function save(p) {
  const el = document.getElementById('sv');
  if (!C.SCORE_ENDPOINT) { el.textContent = 'لم يتم ضبط مكان حفظ النتائج بعد.'; return; }
  try { await send(p); el.textContent = 'تم إرسال النتيجة. لا يمكن تأكيد تسجيلها تلقائياً؛ يرجى التحقق من لوحة الإدارة.'; }
  catch { store.set('queue', store.get('queue', []).concat(p).slice(-100)); el.textContent = 'تعذّر حفظ النتيجة الآن، وسنعيد المحاولة عند فتح الصفحة مرة أخرى.'; }
}
(async () => {
  const q = store.get('queue', []);
  if (q.length && C.SCORE_ENDPOINT) { try { for (const p of q) await send(p); store.set('queue', []); } catch {} }
})();
home();
</script>
</body>
</html>
